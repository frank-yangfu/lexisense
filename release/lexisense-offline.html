<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="qrkCdkZFhMpmyUdhpZiLNf">
<head data-page-node-id="NbePoMRZYPHx0ZGt1NfGYh">
<meta charset="UTF-8" data-page-node-id="gV5qH3yiXotEsyguXLJ70T">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="TipqPsBMXnP32EUExqLirC">
<title>辞源 Lexisense · 一切皆为意义</title>
<meta name="description" content="以「一切皆为意义」为核心理念的英语精确表意训练：词汇意义解码、语法意义地图、句子意义分析、写作意义批改。">
<meta name="theme-color" content="#635bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="辞源">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ================== 设计令牌 ================== */
:root{
  --ink:#0a2540; --ink-2:#425466; --ink-3:#8792a2;
  --brand:#635bff; --brand-2:#7a73ff; --brand-soft:#eeecff;
  --cyan:#0ea5e9; --amber:#f5a524; --green:#16a34a; --red:#e0393e; --pink:#e8367d;
  --bg:#f6f9fc; --card:rgba(255,255,255,.72); --card-solid:#ffffff;
  --line:rgba(10,37,64,.08); --line-2:rgba(10,37,64,.14);
  --shadow:0 2px 5px -1px rgba(50,50,93,.09), 0 6px 16px -4px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px -8px rgba(50,50,93,.16), 0 4px 12px -4px rgba(0,0,0,.06);
  --r:16px; --r-sm:10px;
  --c-agent:#635bff; --c-verb:#0ea5e9; --c-patient:#f5a524; --c-time:#16a34a;
  --c-link:#e8367d; --c-degree:#a855f7; --c-extra:#14b8a6; --c-cond:#64748b; --c-ref:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Inter","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.65; font-size:15px;
  overflow:hidden;
}
/* 背景光斑 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vw 60vh at 8% -10%, rgba(99,91,255,.16), transparent 60%),
    radial-gradient(50vw 50vh at 100% 0%, rgba(14,165,233,.14), transparent 62%),
    radial-gradient(55vw 55vh at 70% 110%, rgba(232,54,125,.10), transparent 60%),
    linear-gradient(180deg,#f8fafc 0%, #f1f5fb 100%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(10,37,64,.16);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(10,37,64,.28)}
::-webkit-scrollbar-track{background:transparent}

/* ================== 布局 ================== */
.app{display:flex;height:100vh;overflow:hidden}
.side{
  width:236px;flex:0 0 236px;height:100%;
  background:rgba(255,255,255,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5;
}
.brand{padding:22px 20px 14px;display:flex;align-items:center;gap:11px}
.logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:linear-gradient(135deg,#635bff,#00d4ff);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;
  box-shadow:0 6px 16px -4px rgba(99,91,255,.55);letter-spacing:-.5px;
}
.brand h1{font-size:16.5px;font-weight:750;letter-spacing:-.2px;line-height:1.25}
.brand small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:500;letter-spacing:.4px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav-t{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:1.2px;padding:14px 10px 7px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
  color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:550;cursor:pointer;
  transition:.16s;margin-bottom:2px;position:relative;
}
.nav a:hover{background:rgba(99,91,255,.07);color:var(--ink)}
.nav a.on{background:linear-gradient(135deg,rgba(99,91,255,.14),rgba(0,212,255,.09));color:var(--brand);font-weight:700;box-shadow:inset 0 0 0 1px rgba(99,91,255,.16)}
.nav a .ic{width:19px;text-align:center;font-size:15px;opacity:.9}
.nav a .bd{margin-left:auto;font-size:10.5px;background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-weight:700}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.side-foot b{color:var(--ink);font-weight:700}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:60px;flex:0 0 60px;display:flex;align-items:center;gap:14px;padding:0 26px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);z-index:4;
}
.topbar h2{font-size:17px;font-weight:750;letter-spacing:-.2px}
.topbar .sub{font-size:12.5px;color:var(--ink-3);font-weight:500}
.topbar .sp{flex:1}
.streak{
  display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#fff7ed,#fef2f2);
  border:1px solid rgba(245,165,36,.28);color:#b45309;padding:5px 12px;border-radius:20px;
  font-size:12.5px;font-weight:700;
}
.view{flex:1;overflow-y:auto;padding:24px 26px 40px;scroll-behavior:smooth}
.wrap{max-width:1080px;margin:0 auto}

/* ================== 通用组件 ================== */
.card{
  background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px;
}
.card+.card{margin-top:16px}
.h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.h h3{font-size:15.5px;font-weight:750;letter-spacing:-.2px}
.h .sp{flex:1}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand)}
.pill.g{background:#dcfce7;color:#15803d}.pill.r{background:#fee2e2;color:#b91c1c}
.pill.a{background:#fef3c7;color:#b45309}.pill.c{background:#e0f2fe;color:#0369a1}
.muted{color:var(--ink-3);font-size:12.5px}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:650;
  padding:9px 17px;border-radius:11px;color:#fff;
  background:linear-gradient(135deg,var(--brand),#7c6cff);
  box-shadow:0 4px 12px -3px rgba(99,91,255,.5);transition:.16s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px -4px rgba(99,91,255,.55)}
.btn:active{transform:translateY(0)}
.btn.gh{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.btn.gh:hover{background:#fff;box-shadow:var(--shadow-lg)}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
/* ================== 移动端：底部标签栏 ================== */
.tabbar{display:none}
@media(max-width:640px){
  .side{display:none}
  .view{padding:16px 13px calc(88px + env(safe-area-inset-bottom))}
  .topbar{height:54px;flex:0 0 54px;padding:0 15px}
  .topbar h2{font-size:15.5px}
  .topbar .sub{display:none}
  .card{padding:16px;border-radius:14px}
  .wordcard .w{font-size:36px}
  .sentence{font-size:15px;padding:12px 13px}
  .annot{font-size:16.5px;line-height:2.9}
  .cmp{grid-template-columns:1fr}
  .radar svg{max-width:100%;height:auto}
  .g2,.g3{grid-template-columns:1fr}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    padding:5px 2px calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 16px -6px rgba(50,50,93,.16);
  }
  .tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:4px 0;color:var(--ink-3);text-decoration:none;font-size:10px;font-weight:650;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .tabbar a .ic{font-size:17px;line-height:1.1}
  .tabbar a.on{color:var(--brand)}
  .tabbar a.on .ic{transform:translateY(-1px)}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  .streak{display:none}
}
@media(min-width:641px) and (max-width:1024px){
  .side{width:196px;flex:0 0 196px}
  .view{padding:20px 18px 34px}
  .g4{grid-template-columns:repeat(2,1fr)}
}
/* 触摸目标与横屏适配 */
.opt,.chip,.tab,.task{min-height:44px}
@media(max-width:640px){ .opt{min-height:46px;padding:12px 13px} .chip{padding:8px 14px} }
@supports(padding:env(safe-area-inset-left)){
  @media(max-width:640px){ .tabbar{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)} }
}

/* 统计块 */
.stat{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.stat .d{font-size:11px;margin-top:5px;font-weight:650}
.stat.brand .n{color:var(--brand)}.stat.green .n{color:var(--green)}
.stat.cyan .n{color:var(--cyan)}.stat.amber .n{color:var(--amber)}

/* 进度条 */
.bar{height:7px;background:rgba(10,37,64,.08);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--brand),#00d4ff);transition:width .5s cubic-bezier(.22,1,.36,1)}

/* 单词卡 */
.wordcard{text-align:center;padding:6px 0 2px}
.wordcard .w{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.15}
.wordcard .ph{color:var(--ink-3);font-size:14px;margin-top:2px;font-family:"Times New Roman",serif}
.tagrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sentence{
  background:linear-gradient(135deg,rgba(99,91,255,.06),rgba(0,212,255,.05));
  border-left:3px solid var(--brand);border-radius:0 12px 12px 0;
  padding:14px 16px;font-size:16.5px;line-height:1.8;margin:14px 0;
}
.sentence .gap{
  display:inline-block;min-width:88px;text-align:center;font-weight:800;color:var(--brand);
  border-bottom:2.5px solid var(--brand);padding:0 6px;margin:0 2px;
}
.sentence .zh{display:block;font-size:13.5px;color:var(--ink-2);margin-top:8px;font-weight:450}

/* 选项 */
.opts{display:grid;gap:9px;margin-top:6px}
.opt{
  display:flex;align-items:flex-start;gap:11px;padding:12px 15px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.78);border:1.5px solid var(--line);transition:.15s;text-align:left;
  font-family:inherit;font-size:14px;color:var(--ink);width:100%;
}
.opt:hover{border-color:var(--brand);background:#fff;transform:translateX(2px)}
.opt .k{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:rgba(10,37,64,.07);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:750;color:var(--ink-2);margin-top:1px;
}
.opt.ok{border-color:var(--green);background:#f0fdf4}
.opt.ok .k{background:var(--green);color:#fff}
.opt.no{border-color:var(--red);background:#fef2f2}
.opt.no .k{background:var(--red);color:#fff}
.opt.dis{cursor:default;opacity:.6}
.opt.dis:hover{transform:none;background:rgba(255,255,255,.78);border-color:var(--line)}
.opt.dis.ok,.opt.dis.no{opacity:1}

/* 解析 */
.explain{
  margin-top:14px;border-radius:13px;padding:14px 16px;font-size:13.5px;line-height:1.75;
  background:rgba(255,255,255,.85);border:1px solid var(--line);
}
.explain.good{border-color:rgba(22,163,74,.3);background:#f0fdf4}
.explain.bad{border-color:rgba(224,57,62,.28);background:#fef2f2}
.explain b{color:var(--ink)}
.explain .hd{font-weight:750;margin-bottom:5px;display:flex;align-items:center;gap:7px}

/* 表格 / 列表 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(10,37,64,.02)}
tr:last-child td{border-bottom:none}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{flex:0 0 118px;color:var(--ink-3);font-weight:650;font-size:12.5px}
.kv .v{flex:1}

/* 语法对比 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:760px){.cmp{grid-template-columns:1fr}}
.cmp .box{padding:13px 15px;border-radius:13px;background:rgba(255,255,255,.8);border:1px solid var(--line)}
.cmp .box .s{font-size:15.5px;font-weight:700;font-family:Georgia,serif}
.cmp .box .m{font-size:13px;color:var(--ink-2);margin-top:5px}

/* 词根网络 */
.rootnet{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;margin-top:14px}
.rcenter{
  padding:14px 20px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#00b4d8);color:#fff;
  text-align:center;box-shadow:0 8px 22px -8px rgba(99,91,255,.6);align-self:center;
}
.rcenter .r{font-size:20px;font-weight:800;letter-spacing:-.3px}
.rcenter .m{font-size:11.5px;opacity:.92;margin-top:1px}
.rnode{
  flex:1 1 190px;max-width:240px;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.85);
  border:1px solid var(--line);font-size:13px;box-shadow:var(--shadow);
}
.rnode .w{font-weight:750;font-size:14.5px;color:var(--brand)}
.rnode .m{color:var(--ink-2);font-size:12.5px;margin-top:3px;line-height:1.6}

/* 句子标注 */
.annot{font-size:19px;line-height:2.5;font-family:Georgia,"Times New Roman",serif;padding:16px 4px}
.tk{position:relative;display:inline-block;padding:2px 4px;border-radius:6px;margin:0 1px;cursor:default;
  background:rgba(99,91,255,.09);box-shadow:inset 0 -2.5px 0 rgba(99,91,255,.35)}
.tk:hover{background:rgba(99,91,255,.17)}
.tk::after{
  content:attr(data-r);position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;
  font-size:10px;font-family:inherit;font-weight:700;color:#fff;background:var(--c-agent);
  padding:1px 7px;border-radius:8px;white-space:nowrap;letter-spacing:.2px;
}
.tk.verb::after{background:var(--c-verb)}.tk.patient::after{background:var(--c-patient)}
.tk.time::after{background:var(--c-time)}.tk.link::after{background:var(--c-link)}
.tk.degree::after{background:var(--c-degree)}.tk.extra::after{background:var(--c-extra)}
.tk.cond::after{background:var(--c-cond)}.tk.ref::after{background:var(--c-ref)}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.legend span{font-size:11.5px;font-weight:650;display:flex;align-items:center;gap:5px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}

/* 批改 */
.editor{
  width:100%;min-height:190px;border-radius:14px;border:1.5px solid var(--line);
  padding:15px 16px;font-family:inherit;font-size:14.5px;line-height:1.9;resize:vertical;
  background:rgba(255,255,255,.85);color:var(--ink);outline:none;transition:.15s;
}
.editor:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,91,255,.1);background:#fff}
.marked{font-size:15px;line-height:2.3;padding:16px 4px;font-family:Georgia,serif}
mark{margin:0 1px;padding:2px 4px;border-radius:5px;cursor:help;font-weight:600}
mark.h{background:rgba(224,57,62,.15);box-shadow:inset 0 -2.5px 0 var(--red)}
mark.m{background:rgba(245,165,36,.18);box-shadow:inset 0 -2.5px 0 var(--amber)}
mark.l{background:rgba(99,91,255,.13);box-shadow:inset 0 -2.5px 0 var(--brand)}
.issue{display:flex;gap:11px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.8);border:1px solid var(--line);margin-bottom:8px}
.issue .lv{width:5px;border-radius:5px;flex:0 0 5px;background:var(--red)}
.issue.m .lv{background:var(--amber)}.issue.l .lv{background:var(--brand)}
.issue .t{font-weight:700;font-size:13.5px}
.issue .d{font-size:12.8px;color:var(--ink-2);margin-top:3px;line-height:1.65}
.issue .f{font-size:12.8px;color:var(--green);margin-top:4px;font-weight:600}

/* 雷达图 */
.radar{display:flex;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}

/* 任务卡 */
.task{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;background:rgba(255,255,255,.8);border:1px solid var(--line);transition:.15s;cursor:pointer}
.task:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.task .ti{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--brand-soft)}
.task .tn{font-weight:700;font-size:14px}
.task .td{font-size:12.3px;color:var(--ink-3);margin-top:1px}
.task .go{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--brand)}

/* 章节切换（模块内 tab） */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 15px;border-radius:11px;font-size:13.5px;font-weight:650;cursor:pointer;
  background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink-2);transition:.15s}
.tab:hover{background:#fff}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:650;cursor:pointer;
  background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--ink-2);transition:.14s}
.chip:hover{background:#fff;border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mt{margin-top:14px}.mt2{margin-top:20px}
.center{text-align:center}
.fadein{animation:fi .34s cubic-bezier(.22,1,.36,1)}
@keyframes fi{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.empty{padding:36px;text-align:center;color:var(--ink-3);font-size:13.5px}
.hide{display:none!important}
.divider{height:1px;background:var(--line);margin:16px 0}
ul.clean{list-style:none}
ul.clean li{padding:7px 0 7px 20px;position:relative;font-size:13.6px;line-height:1.7}
ul.clean li::before{content:"";position:absolute;left:4px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
ol.clean{margin-left:20px}
ol.clean li{padding:5px 0;font-size:13.6px;line-height:1.7}
.q{font-size:15px;font-weight:700;margin-bottom:10px}
.en{font-family:Georgia,"Times New Roman",serif}
.hl{background:linear-gradient(180deg,transparent 62%,rgba(99,91,255,.22) 62%);padding:0 2px;font-weight:700}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 22px;border-radius:13px;font-size:13.5px;font-weight:600;

    why: 'will 与 be going to 的核心分野就是"决定的时间点"：说话当下才决定 → will；事先已有打算 → be going to。' },
  { s: 'We should protect the environment.', src: '小学德育语料', zh: '我们应该保护环境。', g: 'g6',
    q: 'should 在这里表达的是什么？', options: ['强制命令（必须）', '建议与义务：这样做是对的，但不是强制', '可能性', '过去习惯'], ans: 1,
    why: 'should 的语气弱于 must：它给出"应当"的价值判断，留给听者余地。把 should 误读成 must，会把建议变成命令。' },
  { s: 'It was raining when we arrived.', src: '小学阅读语料', zh: '我们到达时正在下雨。', g: 'g6',
    q: '为什么"下雨"用进行时，"到达"用一般过去时？', options: ['随便选的', '下雨是持续的背景，到达是切入的瞬间事件', '两个动作都是过去，必须一致', '进行时表示过去'], ans: 1,
    why: '过去进行时铺背景、一般过去时给事件——这是英语叙事的最基本节奏：画面 + 事件。' },

  /* ---------- 初中 · 真实语料挑战 ---------- */
  { s: 'I have been to Dunhuang twice.', src: '初中教材语料', zh: '我去过敦煌两次。', g: 'g7',
    q: '把 have been to 换成 have gone to，句子会怎样？', options: ['意义不变', '从"去过已回来"变成"去了还没回来"，说话人此刻不在场', '变成过去时', '语法错误'], ans: 1,
    why: 'have been to 谈经历（人在现场）；have gone to 谈去向（人不在）。用后者会让"我去过敦煌两次"变成"我去了敦煌（现在不在这儿）"，无法与 twice 搭配。' },
  { s: 'The train leaves at 9:40 tomorrow morning.', src: '车站广播语料', zh: '火车明早 9:40 发车。', g: 'g7',
    q: '说将来的事，为什么用一般现在时？', options: ['广播里可以随便说', '时刻表属于固定日程，不随人的意志改变，用一般现在时表将来', '因为 leave 是特殊动词', '因为用了 tomorrow'], ans: 1,
    why: '英语用一般现在时表达"已排定的、不可更改的将来"。时刻表、课表、日历都属于这一类——它们的确定性高于人的打算。' },
  { s: 'It takes me twenty minutes to get to school by bike.', src: '初中写作语料', zh: '我骑车到学校要二十分钟。', g: 'g7',
    q: '为什么主语用 It 而不是 I？', options: ['两种都可以', 'take 表示"某事占用时间"时，形式主语是 It；用 I take 会说成"我占用二十分钟"', 'I 不能作主语', '因为用了 by bike'], ans: 1,
    why: 'It takes sb time to do sth 的结构里，真正的主语是 to do 这件事，It 只是形式主语。换成 I take 会改变施受关系。' },
  { s: 'He used to be afraid of dogs.', src: '初中阅读语料', zh: '他过去怕狗。', g: 'g7',
    q: 'used to 在这句话里暗示了什么？', options: ['他现在还怕狗', '他现在不怕了——这是"过去曾经"与"现在不同"的对比', '他一直怕狗', '他将来会怕狗'], ans: 1,
    why: 'used to 的意义重心永远在"现在不再如此"。如果说 He was afraid of dogs，只报告过去；加 used to 则明确宣告现状已改变。' },
  { s: 'Mistakes were made during the transition.', src: '新闻发布会常见表达', zh: '过渡期间出现了一些失误。', g: 'g8',
    q: '这句话在意义上的关键选择是什么？', options: ['使用了过去时', '使用被动语态省略了施事，刻意回避"谁犯了错"', '使用了复数名词', '使用了介词 during'], ans: 1,
    why: '被动语态的意义不是"换种说法"，而是信息焦点与责任的再分配。Someone made mistakes 责任明确；Mistakes were made 责任被抹去。' },
  { s: 'The lights are on. He must be at home.', src: '初中推理语料', zh: '灯亮着，他一定在家。', g: 'g8',
    q: '这里的 must 表示什么？', options: ['必须（命令）', '有根据的肯定推测：说话人基于证据几乎确定', '可能', '允许'], ans: 1,
    why: '同样是 must，表"必须"是施加义务，表"一定"是给出把握。判断依据是后面跟的动词与语境：灯亮是证据，所以是推测。' },
  { s: 'Could you tell me where the station is?', src: '初中交际语料', zh: '请问车站在哪里？', g: 'g8',
    q: '为什么从句里是 the station is 而不是 is the station？', options: ['两种都对', '宾语从句必须用陈述语序', '因为 could 是过去式', '因为 where 已经提前'], ans: 1,
    why: '疑问词一旦移到句首引导从句，从句内部就要恢复"主谓正常顺序"。这是英语从句最容易被中文语序带偏的地方。' },
  { s: 'The window was broken by someone in our class.', src: '初中写作语料', zh: '窗户被我们班某个人打破了。', g: 'g8',
    q: '保留 by someone 与删掉它，意义上有什么不同？', options: ['没有不同', '保留 by 短语把责任指向了施事；删掉则只谈结果，不追究是谁', '删掉后句子不通', '保留后变成进行时'], ans: 1,
    why: '被动语态是否带 by 短语，是说话人主动做出的"要不要追究责任"的选择——这正是被动语态的语用价值。' },
  { s: 'The girl who is standing there is my cousin.', src: '初中教材语料', zh: '站在那边的女孩是我表妹。', g: 'g9',
    q: '如果删掉 who is standing there，句子会有什么损失？', options: ['没有损失', '失去识别功能：读者不知道说的是哪个女孩', '变成疑问句', '语法错误'], ans: 1,
    why: '限定性定语从句的作用是"缩小范围、锁定唯一对象"。删掉它，the girl 这个定指就失去了依据。' },
  { s: 'I was walking home when it suddenly started to rain.', src: '初中阅读语料', zh: '我正在往家走，突然下起雨来。', g: 'g9',
    q: '为什么"走"用进行时、"下雨"用一般过去时？', options: ['为了显得语法复杂', '"走"是进行中的背景画面，"下雨"是突然切入的事件', '两个动作都发生在过去，随便安排', '因为用了 when'], ans: 1,
    why: '过去进行时给背景，一般过去时给事件，when 在这里的意思是"就在这时"。这个结构承载的是画面感，而不是时间顺序。' },
  { s: 'The more you read, the more you understand.', src: '初中格言语料', zh: '读书越多，懂得越多。', g: 'g9',
    q: '这个结构里的两个 the 能不能省略？', options: ['可以，省略后意义不变', '不能：双 the 结构表达"前后联动、一方随另一方变化"，缺了就失去联动意义', '可以省略后一个', '可以省略前一个'], ans: 1,
    why: 'the + 比较级..., the + 比较级... 是英语表达"联动变化"的固定手段。省略 the 后，两个分句变成孤立的陈述，因果关系消失。' },
  { s: 'Although it was raining, they kept working.', src: '初中阅读语料', zh: '尽管在下雨，他们仍继续工作。', g: 'g9',
    q: '如果把 Although 换成 But，句子应该怎么写？', options: ['Although 与 But 可以直接互换', '去掉 Although，改成 It was raining, but they kept working. — 英语中一个句子只能用一头', 'It was raining, although but they kept working.', '两者可以同时使用以加强语气'], ans: 1,
    why: '中文说"虽然…但是…"，英语只能用其一。这背后是逻辑标记的分工：一个主从关系只需要一个标记。' },
  { s: 'She has worked in this school since 2016.', src: '初中教材语料', zh: '她自 2016 年起在这所学校工作。', g: 'g9',
    q: '这句话暗示了关于现在什么信息？', options: ['她已经离职了', '她现在仍在这所学校工作', '她换了工作', '无法判断'], ans: 1,
    why: '现在完成时 + since 表示从过去延续到现在。若她已离职，必须改用一般过去时 She worked here from 2016 to 2020。' }
];

/* ==== data-gskill-b.js ==== */
/* ============================================================
   辞源 · 分学段技能语料（高中）

window.DBX = window.DBX || {};

/* ---------- 高中 · 语法意义地图 ---------- */
DBX.gram.push(
  {
    id: 's-noun-clause', g: 'g10', title: '名词性从句：that 与 what 的分工', weight: 5,
    q: '为什么有时候用 that，有时候必须用 what？',
    a: [
      'that 在名词性从句中只起连接作用，不充当成分、没有词义——它引导的是一个"已经完整"的命题。',
      'what 等于 the thing(s) which，它同时充当成分并自带"所…的事物"这一意义。',
      '判断方法：从句里缺主语/宾语 → 用 what；什么都不缺 → 用 that。'
    ],
    pairs: [
      { s: 'That he passed the exam surprised us.', m: 'he passed the exam 本身完整 → that 只作连接' },
      { s: 'What he said surprised us.', m: 'said 缺宾语 → what 补上，意为"他说的话"' },
      { s: 'I believe (that) he is honest.', m: '宾语从句，that 可省略' },
      { s: 'This is what I want.', m: '表语从句：want 缺宾语 → what' }
    ],
    quiz: { q: '___ he told me yesterday turned out to be false.', options: ['That', 'What', 'Which', 'Whether'], ans: 1,
      why: 'told me 后面缺直接宾语（tell sb sth），需要 what 既引导又补位，意为"他昨天告诉我的（那件事）"。用 That 会导致从句缺成分，句子不成立。' }
  },
  {
    id: 's-nonfinite', g: 'g10', title: '非谓语动词：不定式与动名词的意义分野', weight: 5,
    q: 'to do 与 doing 作宾语时，意义上差在哪？',
    a: [
      '不定式偏向"尚未发生、指向未来、带有目的性"：hope to do、decide to do。',
      '动名词偏向"已经发生、被当作事实或经验来谈"：enjoy doing、admit doing。',
      '有些动词两者皆可但意义不同：remember to do（记得去做）vs remember doing（记得做过）。'
    ],
    pairs: [
      { s: 'I remember locking the door.', m: '记得"锁过门"这件事（已发生）' },
      { s: 'Remember to lock the door.', m: '记得"要去锁门"（未发生）' },
      { s: 'He stopped to smoke.', m: '停下手中的事，目的 = 去抽烟' },
      { s: 'He stopped smoking.', m: '戒烟：停止"抽烟"这个行为本身' }
    ],
    quiz: { q: 'I regret ___ you that the flight has been cancelled.', options: ['telling', 'to tell', 'tell', 'having told'], ans: 1,
      why: 'regret to do 用于"遗憾地要做某事"（常见于通知坏消息）；regret doing 表示"后悔做过某事"。此句是正式通知航班取消，属于前者。' }
  },
  {
    id: 's-emphasis', g: 'g10', title: '强调句 It is...that：把焦点钉死', weight: 5,
    q: '强调句不是"加强语气"，而是重新指派信息焦点。',
    a: [
      'It is + 被强调部分 + that/who + 其余部分：被强调的部分就是这句话真正要传达的新信息。',
      '它能强调主语、宾语、状语，但不能强调谓语。',
      '判断方法：把 It is 与 that 去掉，剩下的仍能组成一个完整句子 → 就是强调句。'
    ],
    pairs: [
      { s: 'It was Tom who broke the window.', m: '焦点在"是汤姆"（不是别人）' },
      { s: 'It was the window that Tom broke.', m: '焦点在"是窗户"（不是门）' },
      { s: 'It was yesterday that I met him.', m: '焦点在"是昨天"（不是今天）' },
      { s: 'Tom broke the window yesterday.', m: '中性陈述：没有特别焦点' }
    ],
    quiz: { q: 'It was in Xi’an ___ I first met my wife.', options: ['where', 'which', 'that', 'when'], ans: 2,
      why: '去掉 It was 与空格后，I first met my wife in Xi’an 仍是完整句子 → 这是强调句，统一用 that。用 where 会误判为定语从句（但定语从句需要有先行词作地点，此处 in Xi’an 已是完整状语）。' }
  },
  {
    id: 's-inversion', g: 'g10', title: '倒装：把最重的意义放到句首', weight: 5,
    q: '为什么英语有时要把助动词提到主语前面？',
    a: [
      '否定副词（never、seldom、hardly）置于句首时必须部分倒装——把否定的重量放在最前。',
      'Only + 状语置于句首时也倒装，强调"只有在这种条件下"。',
      '完全倒装（谓语整体提前）用于地点方位副词开头：Here comes the bus。',
      '倒装改变的不是命题内容，而是信息的排列顺序与强调重心。'
    ],
    pairs: [
      { s: 'I have never seen such a thing.', m: '中性陈述' },
      { s: 'Never have I seen such a thing.', m: '把"从未"提到最前，语气强烈得多' },
      { s: 'He only realised the truth after the meeting.', m: '陈述：会后才知道' },
      { s: 'Only after the meeting did he realise the truth.', m: '强调"直到会后这个时间点才"' }
    ],
    quiz: { q: 'Not only ___ hard, but he also helped others.', options: ['he worked', 'did he work', 'he did work', 'worked he'], ans: 1,
      why: 'Not only 置于句首 → 该分句部分倒装，把助动词 did 提到主语前。同时注意 not only...but also 连接两个分句时只有前一个倒装。' }
  },
  {
    id: 's-subjunctive', g: 'g11', title: '虚拟语气：动词形式在说"这是假的"', weight: 5,
    q: '虚拟语气的意义核心是"与事实相反"，动词的时态倒退一格就是信号。',
    a: [
      '与现在事实相反：从句用一般过去时（be 用 were），主句用 would/could + 原形。',
      '与过去事实相反：从句用过去完成时，主句用 would have done。',
      '与将来事实相反：从句用 were to do 或 should do。',
      '所以看到 If I were...，不要理解成"过去"，而要说"事实上我不是"。'
    ],
    pairs: [
      { s: 'If I have time, I will go.', m: '真实条件：有时间（可能真的去）' },
      { s: 'If I had time, I would go.', m: '虚拟：其实没时间（与现在相反）' },
      { s: 'If I had had time, I would have gone.', m: '虚拟：当时没时间（与过去相反）' },
      { s: 'I wish I were taller.', m: 'wish 后一律虚拟，be 动词用 were' }
    ],
    quiz: { q: 'If he ___ the warning, he would not be in hospital now.', options: ['heeded', 'had heeded', 'would heed', 'heeds'], ans: 1,
      why: '结果是"现在在医院"（与现在相反），原因是"当初没听警告"（与过去相反）→ 错综虚拟：从句用过去完成时 had heeded，主句用 would not be。' }
  },
  {
    id: 's-modal-perfect', g: 'g11', title: '情态动词 + have done：对过去下判断', weight: 5,
    q: 'must have done / should have done / could have done 说的是三种完全不同的态度。',
    a: [
      'must have done：对过去的肯定推测（他一定做过）。',
      'should have done：本该做却没做（带责备或遗憾）。',
      'could have done：本来能做却没做，或"可能做过"（不确定）。',
      'need not have done：本来不必做（却做了）。'
    ],
    pairs: [
      { s: 'He must have missed the train.', m: '推测：他一定没赶上' },
      { s: 'He should have told us earlier.', m: '责备：他本该早点说（但没说）' },
      { s: 'He could have helped, but he did not.', m: '本可以帮（但没帮）' },
      { s: 'You need not have bought so much.', m: '你本不必买这么多（但买了）' }
    ],
    quiz: { q: 'The road is wet. It ___ rained last night.', options: ['must have', 'should have', 'could have', 'need have'], ans: 0,
      why: '"路是湿的"是对过去的强证据 → 几乎可以肯定下过雨，用 must have rained。should have rained 会变成"昨晚本该下雨（却没下）"，与证据矛盾。' }
  },
  {
    id: 's-non-restrictive', g: 'g11', title: '非限定性定语从句：逗号决定意义', weight: 5,
    q: '一个逗号，把"识别身份"变成了"补充说明"。',
    a: [
      '限定性从句（无逗号）：用来锁定是哪一个，删掉后所指不明。',
      '非限定性从句（有逗号）：只是补充，删掉后身份依然清楚。',
      '非限定性从句不能用 that，也不能用 why；which 还可以指代整个前句。'
    ],
    pairs: [
      { s: 'My brother who lives in Xi’an is a doctor.', m: '暗示还有别的兄弟：住在西安的那个' },
      { s: 'My brother, who lives in Xi’an, is a doctor.', m: '只有一个兄弟，住西安只是补充' },
      { s: 'He failed the exam, which surprised us.', m: 'which 指代"他没及格"这件事' },
      { s: 'This is the book that I told you about.', m: '限定性：锁定是哪本书' }
    ],
    quiz: { q: 'He came late again, ___ made his teacher angry.', options: ['that', 'which', 'what', 'it'], ans: 1,
      why: '非限定性从句指代整个前句"他又迟到了"这件事 → 只能用 which，不能用 that。' }
  },
  {
    id: 's-participle', g: 'g11', title: '分词作状语：-ing 与 -ed 的主被动分野', weight: 5,
    q: 'Seeing 与 Seen 开头的句子，主语完全不同。',
    a: [
      '现在分词（-ing）表示主动、进行：动作由句子主语发出。',
      '过去分词（-ed）表示被动、完成：主语是动作的承受者。',
      '分词短语的逻辑主语必须与主句主语一致，否则就是"悬垂分词"——意义上的错误。',
      'having done 表示"在主句动作之前已完成"。'
    ],
    pairs: [
      { s: 'Seeing the dog, the boy ran away.', m: '男孩看见狗（主动）' },
      { s: 'Seen from the hill, the town looks small.', m: '小镇被看（被动）' },
      { s: 'Having finished the work, he went home.', m: '先完成工作，之后回家' },
      { s: 'Given more time, I could do it better.', m: '如果给我更多时间（被动条件）' }
    ],
    quiz: { q: '___ in the rain for two hours, he caught a bad cold.', options: ['Catching', 'Caught', 'Having caught', 'To catch'], ans: 1,
      why: 'he 是"被困在雨中"的承受者 → 过去分词 Caught（be caught in the rain 是固定搭配）。用 Catching 会变成"他正在抓雨"，意义荒谬。' }
  },
  {
    id: 's-long-sentence', g: 'g12', title: '长难句三层穿透：骨架 → 修饰 → 逻辑', weight: 5,
    q: '遇到五十词以上的长句，按什么顺序拆？',
    a: [
      '第一层找骨架：先抓主句的主语和谓语，把从句和插入语全部括起来。',

  function vSentence() {

  }
  function tAnnot() {
    var s = DB.sentences[curSent];
    // 依原文顺序定位每个成分，未标注部分（逗号、空格）原样输出，保证句子完整还原
    var body = '', pos = 0;
    s.tokens.forEach(function (t) {
      var key = t.t.replace(/[.,;:!?"']/g, '').trim();
      var i = s.s.indexOf(key, pos);
      if (i < 0) return;
      if (i > pos) body += esc(s.s.slice(pos, i));
      body += '<span class="tk ' + t.c + '" data-r="' + esc(t.r) + '" title="' + esc(t.n || t.r) + '">' + esc(s.s.slice(i, i + key.length)) + '</span>';
      pos = i + key.length;
    });
    if (pos < s.s.length) body += esc(s.s.slice(pos));
    var tbl = s.tokens.map(function (t) {
      return '<tr><td class="en" style="width:26%"><b>' + esc(t.t) + '</b></td>' +

    });

    if (S.seen.chal.indexOf(cqOrder[cqi]) < 0) S.seen.chal.push(cqOrder[cqi]);

    if (!ok) addWrong({ key: 'c:' + cqOrder[cqi], type: '语料挑战', title: c.s, q: c.q, ans: c.options[c.ans], why: c.why });

        '<div><div class="muted" style="font-weight:700;margin-bottom:9px">五维意义评分</div>' + rows +
        '<div class="explain mt" style="background:rgba(99,91,255,.05);border-color:rgba(99,91,255,.16)">' +

        '</div>';
    }
    return '<div class="card">' +

      '<textarea class="editor" id="wta" placeholder="Paste your English paragraph here...&#10;&#10;示例：I think this is a very good thing. With the development of technology, more and more people use AI in order to do their work. It is very important for us."></textarea>' +
      '<div class="row mt"><button class="btn" data-act="grade">开始批改</button>' +
      '<button class="btn gh sm" data-act="demo">载入示例</button>' +

      '</div>' + out;

  function splitSents(text) {
    // 兼容旧 Safari：不使用 lookbehind
    var t = String(text), out = [], start = 0;
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i);
      var isEnd = (c === '\n') || ('.!?'.indexOf(c) >= 0 && (i + 1 >= t.length || /[\s\n]/.test(t.charAt(i + 1))));
      if (isEnd) {
        var seg = t.slice(start, i + 1).replace(/\n/g, ' ').trim();
        if (seg) out.push(seg);
        start = i + 1;
      }
    }
    var last = t.slice(start).replace(/\n/g, ' ').trim();
    if (last) out.push(last);
    return out;
  }
  function gradeText(text) {
    var sents = splitSents(text);
    var words = countWords(text);
    var issues = [], marked = [];
    sents.forEach(function (sen) {
      var flags = new Array(sen.length).fill(null);
      DB.writeRules.forEach(function (rule) {
        var re;
        try { re = new RegExp(rule.re, 'gi'); } catch (e) { return; }
        var m, guard = 0;
        while ((m = re.exec(sen)) !== null && guard++ < 40) {
          if (m[0].length === 0) { re.lastIndex++; continue; }
          var isSentStart = (m.index === 0);
          if (rule.id === 'vague-subject' && !isSentStart) continue;
          var ok = true;
          for (var i = m.index; i < m.index + m[0].length; i++) {
            if (flags[i] && rank(flags[i]) >= rank(rule.level)) { ok = false; break; }
          }
          if (!ok) continue;
          for (var j = m.index; j < m.index + m[0].length; j++) flags[j] = rule.level;
          issues.push({ cat: rule.cat, level: rule.level, hit: m[0], msg: rule.msg, fix: rule.fix, sent: sen.length > 96 ? sen.slice(0, 96) + '…' : sen });
        }
      });
      marked.push(renderMarked(sen, flags));
    });
    function rank(l) { return l === 'high' ? 3 : l === 'mid' ? 2 : 1; }

    var hi = issues.filter(function (i) { return i.level === 'high'; }).length;
    var mid = issues.filter(function (i) { return i.level === 'mid'; }).length;
    var lo = issues.filter(function (i) { return i.level === 'low'; }).length;
    var wSum = hi * 3 + mid * 2 + lo * 1;
    var n = Math.max(6, words);
    var per20 = wSum / (n / 20);

    var vocab = clamp(100 - issues.filter(function (i) { return ['意义模糊', '动词精确', '指代不明'].indexOf(i.cat) >= 0; }).length / (n / 20) * 26, 12, 100);
    var density = clamp(100 - per20 * 15, 12, 100);
    var avgLen = sents.length ? words / sents.length : 0;
    var struct = clamp(100 - Math.abs(avgLen - 16) * 3.2, 20, 100);
    var logic = clamp(100 - issues.filter(function (i) { return i.cat === '逻辑'; }).length / (n / 20) * 30 - (/(^|\.)\s*(And|But|So)\b/.test(text) ? 4 : 0), 15, 100);
    var clarity = clamp(100 - per20 * 19, 10, 100);
    var gram = clamp(100 - issues.filter(function (i) { return i.cat === '冗余' || i.cat === '责任不明'; }).length / (n / 20) * 22, 20, 100);

    var score = Math.round((vocab + density + struct + logic + clarity) / 5);
    var verdict;
    if (score >= 85) verdict = '表意清晰、信息密度高。继续保持：每个词都承担不可替代的意义。';
    else if (score >= 70) verdict = '整体可读，但仍有若干表达依赖笼统词与模糊限制语。优先替换「thing / very / I think」类占位表达。';
    else if (score >= 55) verdict = '存在明显意义模糊：读者需要猜测你的真实所指。建议先替换模糊名词与笼统评价词，再补充具体数据。';
    else verdict = '意义密度偏低，大量词语未承担信息。建议重写：每句只保留一个核心命题，用具数名词与精确动词替换占位表达。';

    var polished = text
      .replace(/\bin order to\b/gi, 'to').replace(/\bso as to\b/gi, 'to').replace(/\bfor the purpose of\b/gi, 'to')
      .replace(/\bdue to the fact that\b/gi, 'because').replace(/\bin light of the fact that\b/gi, 'because')
      .replace(/\bfor the reason that\b/gi, 'because').replace(/\bowing to the fact that\b/gi, 'because')
      .replace(/\bat this point in time\b/gi, 'now').replace(/\bat the present time\b/gi, 'currently')
      .replace(/\bin the event that\b/gi, 'if')
      .replace(/\bI think that\b/gi, '').replace(/\bI think\b/gi, '').replace(/\bin my opinion,?\s*/gi, '')
      .replace(/\bmore and more\b/gi, 'an increasing number of')
      .replace(/\s+/g, ' ').replace(/\s+([.,;!?])/g, '$1').trim();

    return {
      score: score, issues: issues, marked: marked.join(' '),
      d: { vocab: vocab, density: density, struct: struct, logic: logic, clarity: clarity, gram: gram, amb: clamp((density + clarity) / 2, 0, 100) },
      verdict: verdict, polished: polished,
      stats: ['共 ' + words + ' 词', sents.length + ' 个句子', '平均句长 ' + avgLen.toFixed(1) + ' 词', '命中 ' + issues.length + ' 处（高 ' + hi + ' / 中 ' + mid + ' / 低 ' + lo + '）']
    };
  }
  function renderMarked(sen, flags) {
    var out = '', i = 0;
    while (i < sen.length) {
      if (!flags[i]) { out += esc(sen[i]); i++; continue; }
      var lv = flags[i], j = i;
      while (j < sen.length && flags[j] === lv) j++;
      out += '<mark class="' + lv[0] + '" title="' + esc(lv === 'high' ? '意义模糊' : lv === 'mid' ? '可更精确' : '提示') + '">' + esc(sen.slice(i, j)) + '</mark>';
      i = j;
    }
    return out;
  }
  function doGrade() {
    var t = $('#wta').value.trim();
    if (!t) { toast('请先输入需要批改的英文段落'); return; }
    if (countWords(t) < 4) { toast('文本太短，请输入至少 4 个单词'); return; }
    lastReport = gradeText(t);
    bump('write', lastReport.score >= 70);
    S.mastery.out = clamp(S.mastery.out * 0.6 + lastReport.score * 0.4, 0, 100);
    S.mastery.vocab = clamp(S.mastery.vocab * 0.85 + lastReport.d.vocab * 0.15, 0, 100);
    var key = today();
    var rec = S.history.filter(function (h) { return h.date === key; })[0];
    if (rec) rec.score = Math.max(rec.score, lastReport.score);
    else S.history.push({ date: key, score: lastReport.score });
    if (S.history.length > 120) S.history = S.history.slice(-120);
    save();
    render('write');
    setTimeout(function () { var c = $$('.card'); if (c[1]) c[1].scrollIntoView({ behavior: 'smooth' }); }, 60);
  }

    var acc = (function () {

    var pbars = [1, 2, 3].map(function (i) {

      }).join('') +

      '<div class="ulist">' + gateRows() + '</div>' +
      '<div class="gnew">' +
      '<input id="gin" maxlength="14" autocomplete="off" enterkeyhint="go" placeholder="输入名字，如：小美 / Mike">' +
      '<button class="btn brand" data-act="gcreate" type="button">开始学习</button></div>' +
      '<div class="muted" style="font-size:11.5px;margin-top:12px;line-height:1.6">同一台设备可创建多个学生，各自独立进度。随时点右上角「● 学生名」切换。</div>' +
      '</div>';
    g.classList.remove('hide');
    if (!isSwitch) setTimeout(function () { var i = document.getElementById('gin'); if (i && i.focus) i.focus(); }, 80);
  }
  function hideGate() { var g = document.getElementById('gate'); if (g) g.classList.add('hide'); }
  function enterUser(id) {
    if (!USERS.list.some(function (u) { return u.id === id; })) { toast('学生不存在'); return; }
    S = loadState(id);
    USERS.cur = id; saveUsers();
    rollDay();                     // 登录后校准当天：跨天登录同样计入连续天数
    save();
    curWord = null; cq = null; lastReport = null;
    hideGate(); go('today');
    toast('已登录：' + (S.name || ''));
  }
  function doCreate() {
    var n = validName($('#gin') && $('#gin').value);
    if (!n) { toast('名字需为 1–14 个字符，仅限中英文、数字、空格与 .-·'); return; }
    var low = n.toLowerCase();
    for (var i = 0; i < USERS.list.length; i++) {
      if (USERS.list[i].name.toLowerCase() === low) { enterUser(USERS.list[i].id); toast('欢迎回来，' + USERS.list[i].name); return; }
    }
    var id = 'u' + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36);
    USERS.list.push({ id: id, name: n, ts: Date.now() });
    USERS.cur = id; saveUsers();
    S = loadState(id); S.name = n;
    rollDay();                     // 新档案首次进入即计第 1 天
    save();
    hideGate(); go('today');
    toast('已创建并登录：' + n);
  }
  function delUser(id) {
    var nm = nameOf(id);
    if (!confirm('确定删除学生「' + nm + '」的全部学习进度与错题？此操作不可恢复。')) return;
    try { localStorage.removeItem(stateKey(id)); localStorage.removeItem(metaKey(id)); } catch (e) { }
    USERS.list = USERS.list.filter(function (u) { return u.id !== id; });
    if (USERS.cur === id) { USERS.cur = null; S = freshState(); S.name = ''; }
    saveUsers();
    if (!USERS.cur) { showGate({ first: true }); toast('已删除：' + nm); }
    else showGate();
  }

  function render(v) {
    var wrap = $('#wrap');
    var html = v === 'today' ? vToday() : v === 'vocab' ? vVocab() : v === 'grammar' ? vGrammar() :
      v === 'sentence' ? vSentence() : v === 'corpus' ? vCorpus() : v === 'write' ? vWrite() :
        v === 'wrong' ? vWrong() : vReport();
    wrap.className = 'wrap fadein';
    wrap.innerHTML = html;
    $('#pgTitle').textContent = TITLES[v][0];
    var nm = (S && S.name) || '';
    $('#pgSub').textContent = (v === 'today' && nm ? nm + '，继续今天的学习 · ' : '') + TITLES[v][1];
    $('#streakN').textContent = S.streak;
    var wn = $('#whoName'); if (wn) wn.textContent = nm || '选择学生';
    $('#view').scrollTop = 0;
    $$('#nav a, .tabbar a').forEach(function (a) { a.classList.toggle('on', a.dataset.v === v); });
    badge();
    try { location.hash = v; } catch (e) { }
  }
  var cur = 'today';
  function go(v) { cur = v; render(v); }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest ? e.target.closest('#nav a, .tabbar a') : null;
    if (nav) { go(nav.dataset.v); return; }
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var a = el.dataset.act, k = el.dataset.k, i = parseInt(el.dataset.i, 10);

    switch (a) {
      case 'goto': {
        var g = el.dataset.go || '', sp = g.split('|', 3), v0 = sp[0] || k;
        if (v0 === 'vocab') {
          if (sp[1] === 'syn') { vocabTab = 'syn'; if (sp[2]) curSyn = DB.syn.filter(function (x) { return x.id === sp[2]; })[0] || curSyn; }
          else if (sp[1] === 'poly') { vocabTab = 'poly'; if (sp[2]) curPoly = DB.poly.filter(function (x) { return x.w === sp[2]; })[0] || curPoly; }
          else { vocabTab = 'card'; }
        } else if (v0 === 'grammar') { if (sp[1]) curGram = sp[1]; }
        else if (v0 === 'corpus') { if (sp[1]) corpusTab = sp[1]; }
        go(v0);
        break;
      }
      case 'vtab': vocabTab = k; go('vocab'); break;
      case 'wans': ansWord(el, i); break;
      case 'wnext': curWord = null; render('vocab'); break;
      case 'synpick': curSyn = DB.syn.filter(function (x) { return x.id === k; })[0]; render('vocab'); break;
      case 'sans': ansSyn(el, i); break;
      case 'polypick': curPoly = DB.poly.filter(function (x) { return x.w === k; })[0]; render('vocab'); break;
      case 'pans': ansPoly(el, parseInt(el.dataset.q, 10), i); break;
      case 'rootpick': curRoot = k; render('vocab'); break;
      case 'gpick': curGram = k; render('grammar'); break;
      case 'gans': ansGram(el, i); break;
      case 'stab': sentTab = k; go('sentence'); break;
      case 'spick': curSent = parseInt(k, 10); render('sentence'); break;
      case 'sdone': bump('sent', true); toast('已标记为掌握'); render('sentence'); break;
      case 'apick': curAmb = parseInt(k, 10); ambDraft = ''; render(sentTab === 'ambig' ? 'sentence' : 'corpus'); break;
      case 'ambsub':
        var v = ($('#ambIn') || {}).value || '';
        if (countWords(v) < 3) { toast('请至少写一个完整的英文句子'); break; }
        ambDraft = v; bump('amb', true);
        $('#ambexp').innerHTML = '<div class="explain good"><div class="hd"><span class="pill g">✓ 已提交</span> 你的改写</div>' +
          '<div class="en" style="margin-top:6px">' + esc(v) + '</div>' +
          '<div style="margin-top:8px">对照标准改写：<b>意义是否唯一确定？读者能否只得到一种解读？</b>若你的版本仍可被两种理解，请补出省略的主语或把分词改写为从句。</div></div>';
        break;
      case 'ambshow':
        var a2 = DB.ambig[curAmb];
        $('#ambexp').innerHTML = '<div class="explain"><div class="hd">标准改写（两种明确解读）</div>' +
          a2.readings.map(function (r) { return '<div style="margin-top:7px"><b>' + esc(r.m) + '</b><br><span class="en">' + esc(r.rw) + '</span><br><span class="muted">' + esc(r.note) + '</span></div>'; }).join('') +
          '</div>'; break;
      case 'ctab': corpusTab = k; go('corpus'); break;
      case 'cans': ansChal(el, i); break;
      case 'cnext': cqi++; render('corpus'); break;
      case 'cnew': newChallenge(); render('corpus'); break;
      case 'grade': doGrade(); break;
      case 'demo':
        $('#wta').value = 'I think artificial intelligence is a very good thing. With the development of technology, more and more people use AI in order to do their work. It is very important for us because it can help people get things done. Some people say it is bad, but I do not think so.';
        toast('已载入示例文本'); break;
      case 'wrm': S.wrong.splice(i, 1); save(); render('wrong'); break;
      case 'wclear':
        if (confirm('确定清空全部 ' + S.wrong.length + ' 条错题记录？')) { S.wrong = []; save(); render('wrong'); }
        break;
      case 'export':
        var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob), a3 = document.createElement('a');
        a3.href = url; a3.download = 'lexisense' + ((S && S.name) ? '-' + S.name : '') + '-' + today() + '.json'; a3.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 800);
        toast('学习数据已导出'); break;
      case 'setseg': {
        var segObj = (window.DBX && DBX.SEGS || []).filter(function (s) { return s.k === k; })[0];
        if (segObj) { var firstG = (DB.segGrades[segObj.k] || [])[0]; if (firstG) { S.grade = firstG.k; S.start = ''; save(); render('today'); } }
        break;
      }
      case 'setgrade': {
        if (DB.gradeMap && DB.gradeMap[k]) { S.grade = k; S.start = ''; save(); render('today'); }
        break;
      }
      case 'scope': {
        if (k === 'grade' || k === 'all') { S.scope = k; save(); render(cur); }
        break;
      }
      case 'who': showGate(); break;
      case 'glogin': enterUser(k); break;
      case 'gcreate': doCreate(); break;
      case 'gclose': hideGate(); break;
      case 'gdel': delUser(k); break;
      case 'reset':
        if (USERS.cur) {
          if (confirm('将清空「' + nameOf(USERS.cur) + '」的全部学习进度、错题与报告（学生档案保留），确定继续？')) {
            S = freshState(); S.name = nameOf(USERS.cur); save();
            curWord = null; cq = null; lastReport = null; go('today');
          }
        }
        break;
    }
  });

  document.addEventListener('keydown', function (e) {
    var tg = e.target;
    if (tg && tg.id === 'gin' && e.key === 'Enter') { e.preventDefault(); doCreate(); return; }
    if (tg && (tg.tagName === 'TEXTAREA' || tg.tagName === 'INPUT')) return;
    if (e.key === 'Escape') { hideGate(); return; }
    var map = { '1': 'today', '2': 'vocab', '3': 'grammar', '4': 'sentence', '5': 'corpus', '6': 'write', '7': 'wrong', '8': 'report' };
    if (map[e.key]) go(map[e.key]);
    if (e.key === 'Enter' && cur === 'vocab' && vocabTab === 'card' && curWord && curWord._done) { curWord = null; render('vocab'); }
  });

  var h = (location.hash || '').replace('#', '');
  if (TITLES[h]) cur = h;
  go(cur);
  /* 无当前学生档案（未登录）→ 显示登录层；已有则直接继续各自进度 */
  if (!USERS.cur || !curUser()) showGate({ first: true });
})();

</script>
<script>
  // 兜底：数据文件未加载时给出明确提示，避免白屏
  window.addEventListener('DOMContentLoaded', function () {
    if (typeof DB === 'undefined' || !DB.words) {
      var w = document.getElementById('wrap');
      if (w) w.innerHTML = '<div class="card"><div class="h"><h3>数据文件未能加载</h3></div>' +
        '<div class="muted">请确保 <b>data-core.js</b>、<b>data-skill.js</b>、<b>app.js</b> 与 <b>index.html</b> 位于同一目录，然后用浏览器重新打开。</div></div>';
    }
  });
  // PWA：离线缓存（仅在 http/https 下生效，file:// 直接打开时忽略）
  </script>
</body>
</html>
